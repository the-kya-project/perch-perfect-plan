# Journey clip playback through the app's signed-link path, against a real,
# processed Cloudflare Stream test clip (scripts/clip-playback-check.ts).
# On Linux, on every pull request, daily, and by hand (Actions → Clip playback
# → Run workflow): upload/ready, the unsigned link refused, the signed
# manifest, thumbnail and player, the signed stream's manifest and first video
# segment downloaded and parsed, and Chromium loading the player. It says in
# its output that iPhone-style playback is NOT covered: Linux WebKit can't
# play HLS.
# On macOS, Mondays 13:23 UTC (8:23 AM EST / 9:23 AM EDT) and by hand: real
# Safari, through safaridriver, plays the signed stream in a plain <video>, as
# the iPhone app does (scripts/clip-playback-safari.ts). Playwright's WebKit
# build couldn't play HLS even on macOS; Safari uses Apple's own media stack.
# macOS minutes count 10x, hence weekly. Running by hand runs both jobs.
# A failing run notifies like any other failing check (GitHub's own failed-run
# notifications). Needs the repository secrets CLOUDFLARE_ACCOUNT_ID and
# CLOUDFLARE_STREAM_TOKEN (a token with Account → Stream → Edit); it fails,
# never skips, when one is missing.
name: Clip playback

on:
  pull_request:
  schedule:
    - cron: "17 14 * * *"   # daily, Linux
    - cron: "23 13 * * 1"   # Mondays, macOS Safari
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clip-playback:
    name: Clip playback (signed links)
    if: github.event_name != 'schedule' || github.event.schedule == '17 14 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Browser and ffmpeg
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y ffmpeg
      - name: Check the test clip through signed links
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_STREAM_TOKEN: ${{ secrets.CLOUDFLARE_STREAM_TOKEN }}
        run: npm run test:clip-playback


  clip-playback-safari:
    name: Clip playback in Safari (iPhone-style)
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '23 13 * * 1'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Turn on Safari's WebDriver
        run: |
          sudo safaridriver --enable
          safaridriver --version
      - name: Play the test clip in Safari through a signed link
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_STREAM_TOKEN: ${{ secrets.CLOUDFLARE_STREAM_TOKEN }}
        run: npm run test:clip-playback:safari
