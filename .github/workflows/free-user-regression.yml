# The free-user regression check: proves Flock work hasn't changed anything for
# an ordinary (non-admin) account. See "Flock safety rules" in CLAUDE.md.
#
# On every pull request ("Free-user regression"): waits for the PR's Vercel
# preview (which runs against the persistent Supabase staging branch), rebuilds
# the plain non-admin account staging-free@example.com with a random password,
# and drives the care app as that account (e2e/free-user/free-user.spec.ts):
# sign in, Home, no Community button, the gear, add a bird, a weight, the daily
# health check, a journal entry, a pet sit with emergency contacts, the sitter
# link signed out, /flock → Home, and the Duo side column.
#
# By hand (Run workflow → target "production"): the read-only production check
# (e2e/free-user/production.spec.ts) with an existing non-admin account. It
# blocks every write in the browser, so it can't create, edit, delete or send
# anything.
#
# Repository secrets:
#   STAGING_DB_URL                    staging session pooler string (already used by staging-migrations.yml)
#   VERCEL_AUTOMATION_BYPASS_SECRET   Vercel → pet-sitter → Settings → Deployment Protection →
#                                     Protection Bypass for Automation (previews are behind Vercel login)
#   PROD_READONLY_EMAIL / PROD_READONLY_PASSWORD   production run only
# A missing secret fails the check; it never skips.
#
# To block merging on it: Settings → Rules → Rulesets → "Protect main" →
# Require status checks → add "Free-user regression".
name: Free-user regression

on:
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: "staging (the latest preview of this ref) or production (read-only)"
        type: choice
        options: [staging, production]
        default: staging

permissions:
  actions: read # to see which earlier runs are still using staging
  contents: read
  deployments: read

jobs:
  free-user:
    name: Free-user regression
    if: github.event_name == 'pull_request' || inputs.target != 'production'
    runs-on: ubuntu-latest
    # Up to 100 minutes waiting for a turn, plus the 40 the check itself may take.
    timeout-minutes: 145
    # One run at a time: every run rebuilds the same staging account. This is
    # the "Wait for this run's turn on staging" step, not a GitHub concurrency
    # group: a group keeps only one waiting run and cancels the one before it,
    # so three overlapping PRs turned one of them red.
    env:
      STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      PRODUCTION_REF: koyqdyamazuuwvqbttnj
      STAGING_REF: upygspynanvuxthgnaph
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check secrets, and refuse anything but the staging project
        shell: bash
        run: |
          missing=0
          for v in STAGING_DB_URL VERCEL_AUTOMATION_BYPASS_SECRET; do
            if [ -z "${!v}" ]; then echo "::error::Repository secret $v is not set (see the top of this workflow)."; missing=1; fi
          done
          [ "$missing" = 0 ] || exit 1
          rest="${STAGING_DB_URL#*://}"
          user="${rest%%@*}"; user="${user%%:*}"
          host="${STAGING_DB_URL##*@}"; host="${host%%[:/?]*}"
          ref=""
          if [[ "$user" == postgres.* ]]; then ref="${user#postgres.}";
          elif [[ "$host" =~ ^db\.([a-z0-9]+)\.supabase\.co$ ]]; then ref="${BASH_REMATCH[1]}"; fi
          if [ "$ref" != "$STAGING_REF" ]; then
            echo "::error::STAGING_DB_URL is not the staging project ($STAGING_REF). Refusing to run."
            exit 1
          fi
          echo "Target: staging ($ref), commit $SHA"

      # First come, first served, by when each job started. A re-run gets a new
      # start time, so it joins the back of the line instead of cutting in. A
      # cancelled or finished run stops being "in progress" and frees the line.
      - name: Wait for this run's turn on staging
        timeout-minutes: 102
        uses: actions/github-script@v7
        with:
          script: |
            const JOB = "Free-user regression";
            const deadline = Date.now() + 100 * 60_000;
            const key = (j) => [Date.parse(j.started_at), j.id];
            const before = (a, b) => {
              const [at, ai] = key(a), [bt, bi] = key(b);
              return at !== bt ? at < bt : ai < bi;
            };
            const running = async (run_id) => {
              const { data } = await github.rest.actions.listJobsForWorkflowRun({ ...context.repo, run_id, filter: "latest", per_page: 100 });
              return data.jobs.filter((j) => j.name === JOB && j.status === "in_progress" && j.started_at);
            };
            let lastSaid = "";
            while (Date.now() < deadline) {
              try {
                const [me] = await running(context.runId);
                if (!me) throw new Error("couldn't find this job yet");
                const { data } = await github.rest.actions.listWorkflowRuns({
                  ...context.repo, workflow_id: "free-user-regression.yml", status: "in_progress", per_page: 100,
                });
                const others = data.workflow_runs.filter((r) => r.id !== context.runId);
                const jobs = (await Promise.all(others.map((r) => running(r.id)))).flat();
                const ahead = jobs.filter((j) => before(j, me));
                if (ahead.length === 0) {
                  core.info("It's this run's turn.");
                  return;
                }
                const said = `Waiting for ${ahead.length} earlier run(s): ${ahead.map((j) => j.run_id).join(", ")}`;
                if (said !== lastSaid) core.info(said);
                lastSaid = said;
              } catch (e) {
                core.warning(`Couldn't read the queue, trying again: ${e.message}`);
              }
              await new Promise((r) => setTimeout(r, 20_000));
            }
            core.setFailed("Still waiting for a turn on staging after 100 minutes.");

      - uses: actions/checkout@v4

      - name: Wait for the Vercel preview of this commit
        id: preview
        uses: actions/github-script@v7
        with:
          script: |
            const sha = process.env.SHA;
            const deadline = Date.now() + 25 * 60_000;
            while (Date.now() < deadline) {
              const { data: deps } = await github.rest.repos.listDeployments({ ...context.repo, sha, per_page: 30 });
              for (const d of deps.filter((d) => /preview/i.test(d.environment))) {
                const { data: statuses } = await github.rest.repos.listDeploymentStatuses({ ...context.repo, deployment_id: d.id, per_page: 10 });
                const latest = statuses[0];
                if (latest?.state === "success" && (latest.environment_url || latest.target_url)) {
                  const url = (latest.environment_url || latest.target_url).replace(/\/$/, "");
                  if (/app\.thekyaproject\.com/.test(url)) continue; // never production
                  core.info(`Preview: ${url}`);
                  core.setOutput("url", url);
                  return;
                }
                if (latest && ["failure", "error"].includes(latest.state)) {
                  core.setFailed(`The Vercel preview for ${sha} failed to deploy (${latest.state}).`);
                  return;
                }
              }
              core.info("Waiting for the Vercel preview…");
              await new Promise((r) => setTimeout(r, 20_000));
            }
            core.setFailed(`No ready Vercel preview for ${sha} after 25 minutes.`);

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx patch-package
          npx playwright install --with-deps chromium

      - name: Rebuild the staging free account (random password per run)
        shell: bash
        run: |
          sudo apt-get install -y -qq postgresql-client >/dev/null 2>&1 || true
          pw="$(openssl rand -hex 24)"
          echo "::add-mask::$pw"
          echo "FREE_USER_PASSWORD=$pw" >> "$GITHUB_ENV"
          psql "$STAGING_DB_URL" -v ON_ERROR_STOP=1 -X -q -v free_password="$pw" -f supabase/staging/free-user.sql

      - name: Run the free-user regression check
        env:
          FREE_USER_BASE_URL: ${{ steps.preview.outputs.url }}
          FREE_USER_EMAIL: staging-free@example.com
          FREE_USER_TARGET: staging
        run: npx playwright test -c e2e/free-user/playwright.config.ts --project staging

      # Build C: the check above proved a free account sees nothing while the
      # members switch is off. Now turn it on for staging (opening day set if
      # it isn't, members open) for this run only, check what the same account
      # sees, and put staging back as it was in the next step, whatever
      # happens. Staging only (the guard in the first step). Until the switch
      # exists on staging (20261122100000_flock_open_to_members.sql reaches
      # staging when it merges to main), this says so and runs nothing.
      - name: Turn the Flock's members switch on for staging (this run only)
        id: switch
        if: success()
        shell: bash
        run: |
          has="$(psql "$STAGING_DB_URL" -X -At -c "select count(*) from information_schema.columns where table_schema = 'public' and table_name = 'flock_settings' and column_name = 'members_open'")"
          if [ "$has" != "1" ]; then
            echo "::notice::Staging doesn't have the Flock's members switch yet (it arrives when 20261122100000_flock_open_to_members.sql merges to main), so the switch-on check didn't run."
            echo "on=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Opening day can't be set without the free season's end
          # (20261122120000_flock_dates_set_together.sql), so a missing end gets
          # a temporary one too; the next step puts both back.
          prev="$(psql "$STAGING_DB_URL" -X -At -F '|' -c "select coalesce(flock_opens_at::text, ''), coalesce(free_season_ends_at::text, ''), members_open from public.flock_settings where id")"
          IFS='|' read -r prev_opens prev_end prev_open <<< "$prev"
          echo "prev_opens=$prev_opens" >> "$GITHUB_OUTPUT"
          echo "prev_end=$prev_end" >> "$GITHUB_OUTPUT"
          echo "prev_open=$prev_open" >> "$GITHUB_OUTPUT"
          echo "Staging before: opens_at='$prev_opens' free_season_ends_at='$prev_end' members_open=$prev_open"
          psql "$STAGING_DB_URL" -v ON_ERROR_STOP=1 -X -q -c "update public.flock_settings set flock_opens_at = coalesce(flock_opens_at, now() - interval '1 hour'), free_season_ends_at = coalesce(free_season_ends_at, now() + interval '30 days'), members_open = true where id;"
          echo "on=true" >> "$GITHUB_OUTPUT"

      - name: Run the switch-on check (what a free account sees once it's on)
        if: steps.switch.outputs.on == 'true'
        env:
          FREE_USER_BASE_URL: ${{ steps.preview.outputs.url }}
          FREE_USER_EMAIL: staging-free@example.com
          FREE_USER_TARGET: staging
          FLOCK_SWITCH_ON: "1"
        run: npx playwright test -c e2e/free-user/playwright.config.ts --project staging-switch-on

      - name: Check what joining saved (agreement, 18+, a free-season membership)
        if: steps.switch.outputs.on == 'true'
        shell: bash
        run: |
          row="$(psql "$STAGING_DB_URL" -X -At -F '|' -c "
            select (a.adult_confirmed_at is not null), a.guidelines_version, a.join_source,
                   (select count(*) from public.entitlements e where e.user_id = u.id and e.source = 'free_season' and e.plan = 'comp' and e.status = 'active'),
                   (select p.region_slug from public.flock_profiles p where p.user_id = u.id)
            from auth.users u join public.flock_agreements a on a.user_id = u.id
            where u.email = 'staging-free@example.com'")"
          echo "Joined account: adult|version|source|free-season rows|chapter = $row"
          IFS='|' read -r adult version source rows chapter <<< "$row"
          [ "$adult" = "t" ] && [ -n "$version" ] && [ "$source" = "care_app" ] && [ "$rows" = "1" ] && [ -n "$chapter" ] \
            || { echo "::error::Joining didn't save an 18+ agreement and exactly one free-season membership."; exit 1; }

      - name: Put staging's members switch back
        if: always() && steps.switch.outputs.on == 'true'
        shell: bash
        env:
          PREV_OPENS: ${{ steps.switch.outputs.prev_opens }}
          PREV_END: ${{ steps.switch.outputs.prev_end }}
          PREV_OPEN: ${{ steps.switch.outputs.prev_open }}
        run: |
          [ "$PREV_OPEN" = "t" ] && open=true || open=false
          # Through stdin: psql fills in :'opens' and :'ends' there, never inside -c.
          # Both in one statement, so the opening-needs-an-end rule holds throughout.
          echo "update public.flock_settings set flock_opens_at = nullif(:'opens', '')::timestamptz, free_season_ends_at = nullif(:'ends', '')::timestamptz, members_open = $open where id;" \
            | psql "$STAGING_DB_URL" -v ON_ERROR_STOP=1 -X -q -v opens="$PREV_OPENS" -v ends="$PREV_END"
          psql "$STAGING_DB_URL" -X -At -c "select 'Staging after: opens_at=' || coalesce(flock_opens_at::text, 'null') || ' free_season_ends_at=' || coalesce(free_season_ends_at::text, 'null') || ' members_open=' || members_open from public.flock_settings where id"

      # What the page showed when a step failed (Playwright's page snapshot),
      # readable in the log without downloading the report.
      - name: Show the failed page
        if: failure()
        shell: bash
        run: |
          for f in $(find test-results-free-user -name error-context.md 2>/dev/null); do
            echo "::group::$f"; cat "$f"; echo "::endgroup::"
          done

      - name: Remove what the run made (the account and everything it owns)
        if: always()
        shell: bash
        run: |
          psql "$STAGING_DB_URL" -v ON_ERROR_STOP=1 -X -q \
            -c "delete from auth.users where email = 'staging-free@example.com';" || true

      - name: Upload the report (screenshots and traces of failures)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: free-user-regression-report
          path: |
            playwright-report-free-user/
            test-results-free-user/
          retention-days: 14

  production:
    name: Free-user check (production, read-only)
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FREE_USER_EMAIL: ${{ secrets.PROD_READONLY_EMAIL }}
      FREE_USER_PASSWORD: ${{ secrets.PROD_READONLY_PASSWORD }}
    steps:
      - name: Check secrets
        shell: bash
        run: |
          if [ -z "$FREE_USER_EMAIL" ] || [ -z "$FREE_USER_PASSWORD" ]; then
            echo "::error::Set repository secrets PROD_READONLY_EMAIL and PROD_READONLY_PASSWORD (an existing non-admin production account)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run the read-only production check
        env:
          FREE_USER_BASE_URL: https://app.thekyaproject.com
          FREE_USER_TARGET: production
        run: npx playwright test -c e2e/free-user/playwright.config.ts --project production

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: free-user-production-report
          path: |
            playwright-report-free-user/
            test-results-free-user/
          retention-days: 14
