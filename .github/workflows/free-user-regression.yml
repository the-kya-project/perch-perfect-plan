# The free-user regression check: proves Flock work hasn't changed anything for
# an ordinary (non-admin) account. See "Flock safety rules" in CLAUDE.md.
#
# On every pull request ("Free-user regression"): waits for the PR's Vercel
# preview (which runs against the persistent Supabase staging branch), rebuilds
# the plain non-admin account staging-free@example.com with a random password,
# and drives the care app as that account (e2e/free-user/free-user.spec.ts):
# sign in, Home, no Community button, the gear, add a bird, a weight, the daily
# health check, a journal entry, a pet sit with emergency contacts, the sitter
# link signed out, /flock → Home, and the Duo side column.
#
# By hand (Run workflow → target "production"): the read-only production check
# (e2e/free-user/production.spec.ts) with an existing non-admin account. It
# blocks every write in the browser, so it can't create, edit, delete or send
# anything.
#
# Repository secrets:
#   STAGING_DB_URL                    staging session pooler string (already used by staging-migrations.yml)
#   VERCEL_AUTOMATION_BYPASS_SECRET   Vercel → pet-sitter → Settings → Deployment Protection →
#                                     Protection Bypass for Automation (previews are behind Vercel login)
#   PROD_READONLY_EMAIL / PROD_READONLY_PASSWORD   production run only
# A missing secret fails the check; it never skips.
#
# To block merging on it: Settings → Rules → Rulesets → "Protect main" →
# Require status checks → add "Free-user regression".
name: Free-user regression

on:
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: "staging (the latest preview of this ref) or production (read-only)"
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read
  deployments: read

jobs:
  free-user:
    name: Free-user regression
    if: github.event_name == 'pull_request' || inputs.target != 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # One run at a time: every run rebuilds the same staging account.
    concurrency:
      group: free-user-regression-staging
      cancel-in-progress: false
    env:
      STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      PRODUCTION_REF: koyqdyamazuuwvqbttnj
      STAGING_REF: upygspynanvuxthgnaph
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check secrets, and refuse anything but the staging project
        shell: bash
        run: |
          missing=0
          for v in STAGING_DB_URL VERCEL_AUTOMATION_BYPASS_SECRET; do
            if [ -z "${!v}" ]; then echo "::error::Repository secret $v is not set (see the top of this workflow)."; missing=1; fi
          done
          [ "$missing" = 0 ] || exit 1
          rest="${STAGING_DB_URL#*://}"
          user="${rest%%@*}"; user="${user%%:*}"
          host="${STAGING_DB_URL##*@}"; host="${host%%[:/?]*}"
          ref=""
          if [[ "$user" == postgres.* ]]; then ref="${user#postgres.}";
          elif [[ "$host" =~ ^db\.([a-z0-9]+)\.supabase\.co$ ]]; then ref="${BASH_REMATCH[1]}"; fi
          if [ "$ref" != "$STAGING_REF" ]; then
            echo "::error::STAGING_DB_URL is not the staging project ($STAGING_REF). Refusing to run."
            exit 1
          fi
          echo "Target: staging ($ref), commit $SHA"

      - uses: actions/checkout@v4

      - name: Wait for the Vercel preview of this commit
        id: preview
        uses: actions/github-script@v7
        with:
          script: |
            const sha = process.env.SHA;
            const deadline = Date.now() + 25 * 60_000;
            while (Date.now() < deadline) {
              const { data: deps } = await github.rest.repos.listDeployments({ ...context.repo, sha, per_page: 30 });
              for (const d of deps.filter((d) => /preview/i.test(d.environment))) {
                const { data: statuses } = await github.rest.repos.listDeploymentStatuses({ ...context.repo, deployment_id: d.id, per_page: 10 });
                const latest = statuses[0];
                if (latest?.state === "success" && (latest.environment_url || latest.target_url)) {
                  const url = (latest.environment_url || latest.target_url).replace(/\/$/, "");
                  if (/app\.thekyaproject\.com/.test(url)) continue; // never production
                  core.info(`Preview: ${url}`);
                  core.setOutput("url", url);
                  return;
                }
                if (latest && ["failure", "error"].includes(latest.state)) {
                  core.setFailed(`The Vercel preview for ${sha} failed to deploy (${latest.state}).`);
                  return;
                }
              }
              core.info("Waiting for the Vercel preview…");
              await new Promise((r) => setTimeout(r, 20_000));
            }
            core.setFailed(`No ready Vercel preview for ${sha} after 25 minutes.`);

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx patch-package
          npx playwright install --with-deps chromium

      - name: Rebuild the staging free account (random password per run)
        shell: bash
        run: |
          sudo apt-get install -y -qq postgresql-client >/dev/null 2>&1 || true
          pw="$(openssl rand -hex 24)"
          echo "::add-mask::$pw"
          echo "FREE_USER_PASSWORD=$pw" >> "$GITHUB_ENV"
          psql "$STAGING_DB_URL" -v ON_ERROR_STOP=1 -X -q -v free_password="$pw" -f supabase/staging/free-user.sql

      - name: Run the free-user regression check
        env:
          FREE_USER_BASE_URL: ${{ steps.preview.outputs.url }}
          FREE_USER_EMAIL: staging-free@example.com
          FREE_USER_TARGET: staging
        run: npx playwright test -c e2e/free-user/playwright.config.ts --project staging

      # What the page showed when a step failed (Playwright's page snapshot),
      # readable in the log without downloading the report.
      - name: Show the failed page
        if: failure()
        shell: bash
        run: |
          for f in $(find test-results-free-user -name error-context.md 2>/dev/null); do
            echo "::group::$f"; cat "$f"; echo "::endgroup::"
          done

      - name: Remove what the run made (the account and everything it owns)
        if: always()
        shell: bash
        run: |
          psql "$STAGING_DB_URL" -v ON_ERROR_STOP=1 -X -q \
            -c "delete from auth.users where email = 'staging-free@example.com';" || true

      - name: Upload the report (screenshots and traces of failures)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: free-user-regression-report
          path: |
            playwright-report-free-user/
            test-results-free-user/
          retention-days: 14

  production:
    name: Free-user check (production, read-only)
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FREE_USER_EMAIL: ${{ secrets.PROD_READONLY_EMAIL }}
      FREE_USER_PASSWORD: ${{ secrets.PROD_READONLY_PASSWORD }}
    steps:
      - name: Check secrets
        shell: bash
        run: |
          if [ -z "$FREE_USER_EMAIL" ] || [ -z "$FREE_USER_PASSWORD" ]; then
            echo "::error::Set repository secrets PROD_READONLY_EMAIL and PROD_READONLY_PASSWORD (an existing non-admin production account)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run the read-only production check
        env:
          FREE_USER_BASE_URL: https://app.thekyaproject.com
          FREE_USER_TARGET: production
        run: npx playwright test -c e2e/free-user/playwright.config.ts --project production

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: free-user-production-report
          path: |
            playwright-report-free-user/
            test-results-free-user/
          retention-days: 14
