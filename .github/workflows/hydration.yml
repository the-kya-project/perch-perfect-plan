# The iPhone hydration check (e2e/), on every pull request.
#
# Builds the app exactly as for production, serves it the way Vercel does, and
# loads every front-door page (/, sign-in, sign-up, check-your-email,
# link-expired) in every language the app ships, as iPhone Safari and as the
# iOS app, on WebKit (Safari's engine) and Chromium. Any React hydration error
# or uncaught error fails it. It also walks the duplicate-email sign-up and an
# old confirmation link. Supabase is a local mock (e2e/mock-supabase.mjs): no
# secrets, no real data.
#
# To block merging on it: Settings → Rules → Rulesets (or Branches) → main →
# Require status checks to pass → add "iPhone hydration". How to read a
# failure: e2e/README.md.
name: iPhone hydration

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hydration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hydration:
    name: iPhone hydration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts skips the PostHog CLI binary download (only the
      # production deploy uploads source maps); patch-package is the one
      # postinstall step the app needs.
      - name: Install
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx patch-package

      # The English catalog (src/locales/en.jsonc) must match the t() calls in
      # the code, so a new screen can't ship with phrases missing from it.
      # Fix a failure with `npm run i18n:extract` and commit the catalog.
      - name: Translation catalog matches the code
        run: npm run i18n:check

      # The rule tests (scripts/*.test.ts): no browser, build or secrets. Keep
      # the list alphabetical, one line per test, so PRs adding one rarely
      # conflict. A new test script needs its line here to run in CI.
      - name: Rule tests
        run: |
          npm run test:app-links
          npm run test:auth-email-hook
          npm run test:bereavement-note
          npm run test:billing
          npm run test:bird-age
          npm run test:bird-names
          npm run test:blog-feed
          npm run test:care-badges
          npm run test:check-kind
          npm run test:chop-ingredients
          npm run test:confirm-links
          npm run test:copy-from-bird
          npm run test:cron-auth
          npm run test:cron-telemetry
          npm run test:daily-log
          npm run test:drafts
          npm run test:duo
          npm run test:eligibility
          npm run test:email-clicks
          npm run test:email-tracking
          npm run test:emergency-merge
          npm run test:flock-purge
          npm run test:get-app
          npm run test:gifts
          npm run test:health-rules
          npm run test:home-defaults
          npm run test:intake-date
          npm run test:local-day
          npm run test:native-app-tags
          npm run test:no-home-screen
          npm run test:oauth-errors
          npm run test:onboarding-plan
          npm run test:onboarding-welcome
          npm run test:person-name
          npm run test:poison-control
          npm run test:preview-services
          npm run test:release-check
          npm run test:save-errors
          npm run test:seasonal-calendar
          npm run test:setup-progress
          npm run test:signup-existing
          npm run test:sit-preview-recovery
          npm run test:sit-time-zone
          npm run test:supabase-env
          npm run test:today-card
          npm run test:together-since
          npm run test:url-scrub
          npm run test:utm-carry
          npm run test:weight-baseline
          npm run test:weight-then

      - name: Install browsers (WebKit and Chromium)
        run: npx playwright install --with-deps webkit chromium

      - name: Build (production build, pointed at the mock Supabase)
        run: node e2e/build.mjs

      # The page HTML and bundles this build produces must not load Google
      # Fonts (GDPR). Same guard as the "No Google Fonts" check, on the output.
      - name: No Google Fonts in the production build
        run: node scripts/no-google-fonts.mjs --build

      - name: Run the iPhone hydration check
        run: npm run test:hydration:run

      # Tapping a link while the app is still loading is a race (the startup
      # safety net, e2e/navigation.spec.ts): run it ten more times per
      # language on WebKit, Safari's engine, so a lucky pass can't hide it.
      - name: Repeat the tap-while-loading test on WebKit
        run: npx playwright test -c e2e navigation.spec.ts --repeat-each 10 --project 'webkit-*'

      # Account deletion: every file a person left (Flock photos, care photos,
      # Cloudflare clips) is removed, another member's never is, and a failed
      # run is safe to repeat. In-memory database and buckets; nothing real.
      - name: Account deletion
        run: |
          npm run test:account-deletion
          npm run test:account-files
          npm run test:storage-orphans

      # The Community (Flock) shell, same build: the five tabs, redirects,
      # chips, the Spaces sheet (focus, Escape, swipe), the Duo column, and
      # that everyone but admins is sent Home with no Community code loaded.
      # A made-up session against e2e/duo-mock-server.ts; nothing real.
      - name: Community shell (admin and non-admin)
        run: |
          npm run test:flock-shell
          npm run test:flock-analytics
          npx playwright test -c e2e/flock.config.ts

      - name: Upload the report (screenshots and traces of failures)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hydration-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
