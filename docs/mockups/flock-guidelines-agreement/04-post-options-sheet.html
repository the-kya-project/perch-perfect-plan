<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Options on another member's post</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&amp;family=Newsreader:opsz,wght@6..72,600;6..72,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2d6a4f}a:hover{color:#1a3d2e}
</style>
</head>
<body style="background:#e6ebe6;display:flex;justify-content:center;padding:24px 0">
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #f4f7f4; font-family: 'DM Sans', sans-serif; color: #1a3d2e">
  <div style="background: #1a3d2e; padding: 22px 20px 40px; display: flex; align-items: center; gap: 14px">
    <button aria-label="Open menu" style="width: 48px; height: 48px; border-radius: 999px; border: 2px solid #d6e8dc; background: transparent; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <h1 style="margin: 0; font-family: Newsreader, Georgia, serif; font-weight: 700; font-size: 30px; color: #ffffff">Feed</h1>
  </div>
  <div style="margin: -20px 16px 0; background: #ffffff; border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 12px">
      <span style="width: 40px; height: 40px; border-radius: 999px; background: #2d6a4f; color: #ffffff; display: flex; align-items: center; justify-content: center; font-weight: 700">D</span>
      <div style="flex: 1">
        <div style="font-weight: 700; font-size: 16px">Dana R.</div>
        <div style="font-size: 13px; color: #5f5e5a">Learn together · 2h</div>
      </div>
      <span style="font-size: 22px; color: #3d4f45">···</span>
    </div>
    <p style="margin: 0; font-size: 15px; line-height: 1.5">Pip finally stepped up onto the perch without a treat today. Three weeks of tiny steps!</p>
    <div style="height: 210px; border-radius: 14px; background: #d5dfd5; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #3d4f45">Member photo</div>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(20, 40, 38, 0.45)"></div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #ffffff; border-radius: 28px 28px 0 0; padding: 12px 20px 30px; display: flex; flex-direction: column; gap: 10px">
    <div style="align-self: center; width: 40px; height: 5px; border-radius: 999px; background: #d5dfd5"></div>
    <div style="display: flex; justify-content: flex-end">
      <button aria-label="Close" style="width: 44px; height: 44px; border-radius: 999px; border: none; background: #f1f5f0; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1a3d2e" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <a href="05-flag-sheet.html" style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 14px; background: #f1f5f0; color: #1a3d2e; text-decoration: none">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2d6a4f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4"/><path d="M5 4h11l-2 4 2 4H5"/></svg>
      <span style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 16px; font-weight: 700">Flag this post</span>
        <span style="font-size: 13px; line-height: 1.4; color: #3d4f45">The Kya team reviews it privately. Dana won't know who flagged it.</span>
      </span>
    </a>
    <button style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 14px; border: none; background: #f1f5f0; color: #1a3d2e; text-align: left; font-family: 'DM Sans', sans-serif">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2d6a4f" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M6.5 6.5l11 11"/></svg>
      <span style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 16px; font-weight: 700">Block Dana</span>
        <span style="font-size: 13px; line-height: 1.4; color: #3d4f45">You won't see each other's posts, comments, or journeys. You can undo this in Settings.</span>
      </span>
    </button>
    <button style="height: 52px; border-radius: 14px; border: 2px solid #d5dfd5; background: #ffffff; color: #1a3d2e; font-family: 'DM Sans', sans-serif; font-size: 16px; font-weight: 700">Cancel</button>
  </div>
</div>
</body>
</html>
