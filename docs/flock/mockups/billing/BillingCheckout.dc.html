<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Entering the card on the checkout page</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&amp;family=Newsreader:opsz,wght@6..72,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2d6a4f}a:hover{color:#1a3d2e}
.lab{display:block;font-size:13px;font-weight:500;color:#3d4f45;margin-bottom:6px}
.fld{box-sizing:border-box;width:100%;min-height:44px;padding:0 12px;border:1px solid #cfd8ce;border-radius:8px;background:#ffffff;font-family:'DM Sans',sans-serif;font-size:15px;color:#1a3d2e}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; font-family: 'DM Sans', sans-serif; color: #1a3d2e; overflow: hidden">
  <div style="background: #1a3d2e; color: #ffffff; padding: 16px 20px 22px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 10px">
      <a href="#" aria-label="Back to Kya and Co." style="width: 32px; height: 44px; display: grid; place-items: center; color: #ffffff"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
      <span style="width: 28px; height: 28px; border-radius: 8px; background: #cdeab0; color: #1a3d2e; display: grid; place-items: center; font-family: 'Newsreader', Georgia, serif; font-weight: 700; font-size: 15px">K</span>
      <span style="font-size: 15px; font-weight: 700">Kya &amp; Co.</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 14px; color: #d6e8dc">The Flock · Yearly</span>
      <span style="font-family: 'Newsreader', Georgia, serif; font-size: 32px; font-weight: 700; line-height: 1.1">Free until [free season end]</span>
      <span style="font-size: 14px; color: #d6e8dc">Then billed yearly · Nothing due today</span>
    </div>
  </div>
  <form style="flex-grow: 1; padding: 22px 20px; display: flex; flex-direction: column; gap: 16px; background: #ffffff">
    <div><label class="lab" for="co-email">Email</label><input id="co-email" class="fld" type="email" value="[member's email]"></div>
    <div>
      <label class="lab" for="co-card">Card information</label>
      <div style="border: 1px solid #cfd8ce; border-radius: 8px; overflow: hidden">
        <input id="co-card" type="text" placeholder="1234 1234 1234 1234" style="box-sizing: border-box; width: 100%; min-height: 44px; padding: 0 12px; border: 0; border-bottom: 1px solid #cfd8ce; font-family: 'DM Sans', sans-serif; font-size: 15px">
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr))">
          <input aria-label="Expiry date" type="text" placeholder="MM / YY" style="box-sizing: border-box; min-height: 44px; padding: 0 12px; border: 0; border-right: 1px solid #cfd8ce; font-family: 'DM Sans', sans-serif; font-size: 15px">
          <input aria-label="Security code" type="text" placeholder="CVC" style="box-sizing: border-box; min-height: 44px; padding: 0 12px; border: 0; font-family: 'DM Sans', sans-serif; font-size: 15px">
        </div>
      </div>
    </div>
    <div><label class="lab" for="co-name">Name on card</label><input id="co-name" class="fld" type="text"></div>
    <div><label class="lab" for="co-zip">Country and ZIP</label><input id="co-zip" class="fld" type="text" value="United States"></div>
    <button type="button" style="margin-top: 6px; width: 100%; min-height: 52px; border: 0; border-radius: 10px; background: #1a3d2e; color: #ffffff; font-family: 'DM Sans', sans-serif; font-size: 16px; font-weight: 700">Start membership</button>
    <p style="margin: 0; font-size: 12px; line-height: 1.5; color: #5f5e5a">You won't be charged until [free season end]. Cancel anytime before then from Membership and billing.</p>
    <p style="margin: auto 0 0; text-align: center; font-size: 12px; color: #5f5e5a">Payments processed securely by Stripe · Terms · Privacy</p>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

renderVals() {
return {};
}
}
</script>
</body>
</html>
