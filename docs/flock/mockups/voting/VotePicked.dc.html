<style>

<div style="width: 390px; height: 980px; box-sizing: border-box; display: flex; flex-direction: column; background: #1a3d2e; font-family: 'DM Sans', sans-serif; color: #1a3d2e; overflow: hidden">
  <header style="padding: 14px 20px 46px; color: #ffffff; display: flex; flex-direction: column; gap: 12px">

    <section style="display: flex; gap: 12px; align-items: flex-start; background: #f2b33d; border: 2px solid #1a3d2e; border-radius: 18px; padding: 14px 16px">

      <button type="button" role="radio" aria-checked="false" class="choice"><span class="logo" role="img" aria-label="[Partner rescue A] logo" style="background: #2d6a4f; color: #ffffff">A</span><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 16px; font-weight: 700">[Partner rescue A]</span><span style="font-size: 13px; line-height: 1.4; color: #3d4f45">[A sentence or two about this partner]</span></span><span class="radio"></span></button>
      <button type="button" role="radio" aria-checked="true" class="choice" style="border-color: #1a3d2e; box-shadow: 0 6px 16px rgba(26,61,46,0.12)"><span class="logo" role="img" aria-label="[Conservation project B] logo" style="background: #f2b33d; color: #1a3d2e">B</span><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 16px; font-weight: 700">[Conservation project B]</span><span style="font-size: 13px; line-height: 1.4; color: #3d4f45">[A sentence or two about this partner]</span></span><span class="radio" style="background: #1a3d2e"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span></button>
      <button type="button" role="radio" aria-checked="false" class="choice"><span class="logo" role="img" aria-label="[Partner rescue C] logo" style="background: #9bcab8; color: #1a3d2e">C</span><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 16px; font-weight: 700">[Partner rescue C]</span><span style="font-size: 13px; line-height: 1.4; color: #3d4f45">[A sentence or two about this partner]</span></span><span class="radio"></span></button>
    </div>
    <span style="text-align: center; font-size: 13px; color: #5f5e5a">Your vote is final once you tap the button.</span>
    <a href="Voted.dc.html" style="display: flex; width: 100%; box-sizing: border-box; min-height: 52px; align-items: center; justify-content: center; border-radius: 999px; border: 2px solid #1a3d2e; background: #f2b33d; color: #1a3d2e; font-size: 16px; font-weight: 700; text-decoration: none">Vote for [Conservation project B]</a>
